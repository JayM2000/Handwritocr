services:
  # ─── FastAPI Server ────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ORIGINS=http://localhost:3000
      - DEBUG=true
    volumes:
      - ./storage:/app/storage
      - ./assets:/app/assets
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Celery Worker ────────────────────────────────
  worker:
    build: .
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q generation
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ./storage:/app/storage
      - ./assets:/app/assets
    depends_on:
      - redis
    restart: unless-stopped

  # ─── Redis ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
